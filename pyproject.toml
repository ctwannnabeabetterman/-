[project]
name = "distributed-beamforming-sync-demo"
version = "0.2.0"
description = "Two-AP time, frequency, and phase synchronization baseband simulation"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.2",
  "matplotlib==3.10.1",
]

[tool.demo]
default-mode = "fast_demo"
random-seed = 2023
